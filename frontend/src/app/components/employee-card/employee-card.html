<article class="card">
  @if (compact()) {
    <div class="card__initials" aria-hidden="true">
      <a [routerLink]="['/equipe', employee().id]">{{ initiales() }}</a>
    </div>
    <p class="card__job">{{ employee().job }}</p>
  } @else {
    <h3 class="card__name">
      <!-- Le nom mène à la fiche : /equipe/12 -->
      <a [routerLink]="['/equipe', employee().id]">
        {{ employee().firstName }} {{ employee().lastName }}
      </a>
    </h3>
    <p class="card__job">{{ employee().job }}</p>
    <p>{{ employee().department }}</p>
    <!-- Liaison de propriete : l'adresse du lien est construite a partir des donnees. -->
    <a [href]="'mailto:' + employee().email">{{ employee().email }}</a>

    <app-status-badge [remote]="employee().remote" />
  }
</article>
